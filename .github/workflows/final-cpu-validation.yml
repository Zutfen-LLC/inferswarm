name: Final CPU Validation

# Hosted canonical Final CPU Validation (Issue #226).
#
# The explicit post-review path for a merge-candidate PR head: it runs the
# canonical full CPU suite (scripts/run_full_cpu_suite.py — the same
# discovery/population-authority/serial-vs-executed identity contract as a
# local run), plus the deterministic finalizer and project-status fixed
# point checks, exactly once on ONE exact reviewed head.
#
# Trigger discipline: workflow_dispatch ONLY, with a required 40-hex
# expected_sha input. The dispatch ref is transport only; expected_sha is
# the execution authority (the workflow checks out that exact commit and
# mechanically requires git rev-parse HEAD == expected_sha before anything
# else runs). Invoked after maintainer GO per
# docs/campaign-gate-ordering.md, e.g.:
#   gh workflow run final-cpu-validation.yml \
#     --ref <pr-branch> -f expected_sha=<exact-reviewed-head-sha>
#
# Duplicate-dispatch policy (Issue #291): the concurrency group below only
# SERIALIZES same-head dispatches; it cannot stop a later dispatch from
# re-running the suite on a fresh runner.  After the exact-SHA checkout and
# environment doctor, scripts/final_validation_reuse.py performs a read-only,
# fail-closed lookup for a previously SUCCESSFUL run of THIS workflow on the
# same immutable head whose receipt artifact is independently verified
# (Actions-API digest, run/attempt/head binding, #226 envelope validation,
# identical canonical suite configuration + environment authority, physical
# execution only — reuse receipts are never sources).  A verified source means
# the canonical suite is NOT executed again; the new run still runs the
# finalizer/status checks on its own checkout and mints its own gate result
# recording execution.mode = verified_prior_execution with the source
# run/attempt/artifact digest.  Any doubt (no source, API outage, rate limit,
# missing permission, any failed verification) runs the full suite.  Ordinary
# CI is never a source.  pr_number stays audit-only.
#
# Untrusted dispatch inputs reach scripts ONLY through quoted environment
# bindings (EXPECTED_SHA / PR_NUMBER), never spliced into script source.
#
# Ordinary PR CI (.github/workflows/ci.yml) stays impact-selected and
# NEVER runs the full suite on ordinary pushes; the two gates are
# deliberately distinct checks. Both must succeed on the same exact head
# before merge. No pull_request_target; no untrusted PR code with
# elevated secrets (permissions are contents: read).

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact reviewed PR head (40-hex SHA) to validate"
        required: true
        type: string
      pr_number:
        description: "PR number for audit/navigation (optional; SHA is authority)"
        required: false
        type: string

permissions:
  contents: read
  # Read-only Actions API access for the duplicate lookup (list runs /
  # artifacts, download a receipt artifact).  No write permission, no
  # secrets, no external cache service.
  actions: read

concurrency:
  # One final validation per requested SHA: a second dispatch for the same
  # exact head queues behind (or is inspected as a duplicate); the validated
  # subject can never silently drift because the checkout is SHA-bound.
  group: final-cpu-validation-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  final-cpu-validation:
    name: Final CPU Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Validate expected_sha shape (fail closed)
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 - <<'EOF'
          import os, re, sys
          sha = os.environ["EXPECTED_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              print(f"expected_sha is not an exact 40-hex git SHA: {sha!r}")
              sys.exit(1)
          pr = os.environ.get("PR_NUMBER", "")
          if pr and not re.fullmatch(r"[1-9][0-9]{0,8}", pr):
              print(f"pr_number is not a plain positive integer: {pr!r}")
              sys.exit(1)
          print("expected_sha shape OK:", sha)
          EOF

      - name: Check out the exact expected SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Mechanically require HEAD == expected_sha
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          head="$(git rev-parse HEAD)"
          expected="$EXPECTED_SHA"
          echo "HEAD=$head expected=$expected"
          if [ "$head" != "$expected" ]; then
            echo "checked-out head does not match the requested exact SHA (fail closed)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Bootstrap canonical CPU test environment (Issue #131)
        run: |
          python3 scripts/bootstrap_test_env.py
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Doctor CPU test environment (Issue #131)
        run: .venv/bin/python scripts/check_test_env.py

      - name: Look up verified prior execution (read-only, fail closed)
        id: reuse
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python scripts/final_validation_reuse.py lookup \
            --out /tmp/reuse-decision.json

      - name: Run canonical full CPU suite (serial/executed identity required)
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          started=$(date +%s)
          set +e
          .venv/bin/python scripts/run_full_cpu_suite.py --json > /tmp/suite-result.json
          suite_rc=$?
          set -e
          ended=$(date +%s)
          echo "$started" > /tmp/suite-started.unix
          echo "$ended" > /tmp/suite-ended.unix
          echo "suite exit code: $suite_rc"
          # The suite FAIL fails the Final CPU Validation Gate here.
          exit $suite_rc

      - name: Run deterministic finalizer check (Issue #130)
        run: python3 scripts/finalize_repository.py --check

      - name: Run project-status check
        run: python3 scripts/sync_project_status.py --check

      - name: Compose and validate final-validation receipt (fail closed)
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          REUSE: ${{ steps.reuse.outputs.reuse }}
          # Read-only (actions: read): a reuse composition re-authenticates
          # its source against the Actions API; if that is impossible the
          # gate FAILS (the suite was skipped), it never mints PASS.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .venv/bin/python scripts/final_validation_reuse.py compose \
            --out /tmp/final-validation-receipt.json

      - name: Retain final-validation receipt artifact
        # The PASS receipt exists only for a run that reached this point
        # successfully; a failed run never mints one (its diagnostics are
        # kept separately below).
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-cpu-validation-receipt
          path: /tmp/final-validation-receipt.json
          retention-days: 90
          if-no-files-found: error

      - name: Retain run diagnostics (never a PASS receipt)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-cpu-validation-diagnostics
          path: |
            /tmp/suite-result.json
            /tmp/reuse-decision.json
          retention-days: 90
          if-no-files-found: warn

      - name: Final CPU Validation summary
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REUSE: ${{ steps.reuse.outputs.reuse }}
        run: |
          echo "Final CPU Validation PASS on exact head $EXPECTED_SHA"
          if [ "$REUSE" = "true" ]; then
            echo "execution: verified_prior_execution (suite not re-run)"
          else
            echo "execution: executed (canonical suite ran in this run)"
          fi
          echo "run: $RUN_URL"
