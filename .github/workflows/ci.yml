name: CI

# Lightweight checks for a documentation/bootstrap repository:
# - YAML syntax for issue templates and workflows
# - frozen Phase-0 workload manifest integrity
# - internal Markdown link integrity
# - repository hygiene (no empty speculative directories)
#
# Deliberately NOT here: GPU benchmarks (no fake GPU CI), no self-hosted
# runners attached to public-PR-triggered workflows. Hardware benchmarks run
# on trusted hardware and are committed with provenance; see BENCHMARKING.md
# and SECURITY.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Docs and repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install check dependencies
        run: |
          python3 -m pip install --user pyyaml jsonschema
          python3 -m pip install --user -r docs/implementation/r6-successor-dense-full-integration-117/evidence/arm-c-retry/frozen-tokenizer/requirements.txt

      - name: Validate YAML files
        run: |
          python3 - <<'EOF'
          import sys, glob
          import yaml
          files = glob.glob(".github/**/*.yml", recursive=True) + \
                  glob.glob(".github/**/*.yaml", recursive=True)
          if not files:
              sys.exit("No YAML files found — checker misconfigured")
          for f in files:
              with open(f) as fh:
                  list(yaml.safe_load_all(fh))
              print(f"OK  {f}")
          print(f"{len(files)} YAML files valid")
          EOF

      - name: Check generated project status
        run: |
          python3 scripts/sync_project_status.py --check
          python3 -m unittest tests.test_project_status -v

      - name: Check evidence manifest lifecycle
        run: |
          python3 scripts/issue137_manifest.py --check
          python3 -m unittest tests.test_evidence_manifest_lifecycle -v

      - name: Check frozen Phase-0 workloads
        run: python3 scripts/check_phase0_workloads.py

      - name: Check issue 74 frozen methodology
        run: python3 -m unittest tests.test_issue74_methodology -v

      - name: Check issue 76 v2 stress methodology
        run: python3 -m unittest tests.test_issue76_v2_stress_selection -v

      - name: Check issue 79 v2 threshold tooling (CPU-only)
        run: python3 -m unittest tests.test_issue79_v2_threshold_tooling -v

      - name: Check issue 83 semantic contract (CPU-only)
        run: python3 -m unittest tests.test_issue83_semantic_contract -v

      - name: Check issue 86 v3 methodology/tooling (CPU-only)
        run: python3 -m unittest tests.test_issue86_v3_methodology -v

      - name: Check issue 90 post-v3 envelope diagnosis (CPU-only)
        run: python3 -m unittest tests.test_issue90_post_v3_diagnosis -v

      - name: Check issue 93 numerical-core doctrine (CPU-only)
        run: python3 -m unittest tests.test_issue93_numerical_core_doctrine -v

      - name: Check issue 95 v4 prediction-aligned methodology (CPU-only)
        run: python3 -m unittest tests.test_issue95_v4_methodology tests.test_issue95_v4_thresholds -v

      - name: Check issue 105 post-v4 core diagnosis (CPU-only)
        run: python3 -m unittest tests.test_issue105_post_v4_core_diagnosis -v

      - name: Check issue 108 post-v4 statistical and metric doctrine (CPU-only)
        run: python3 -m unittest tests.test_issue108_post_v4_statistical_metric_doctrine -v

      - name: Check issue 109 v5 mixture-population methodology freeze (CPU-only)
        run: python3 -m unittest tests.test_issue109_v5_methodology tests.test_issue109_v5_thresholds tests.test_issue109_v5_methodology_freeze -v

      - name: Check issue 110 v5 custody handoff repair (CPU-only)
        run: python3 -m unittest tests.test_issue110_v5_custody_handoff -v

      - name: Check issue 110 terminal-report decimal derivation (CPU-only)
        run: python3 -m unittest tests.test_issue110_terminal_report_decimals -v

      - name: Check issue 115 cleanup retention manifest (CPU-only)
        run: python3 -m unittest tests.test_issue115_cleanup_retention -v

      - name: Check issue 117 R6 successor integration freeze (CPU-only)
        run: python3 -m unittest tests.test_issue117_integration_fixture tests.test_issue117_applicability tests.test_issue117_gemma_strategy tests.test_issue117_planner tests.test_issue117_preflight tests.test_issue117_proof tests.test_issue117_provenance tests.test_issue117_checkpoint_authority tests.test_issue117_accepted_subject tests.test_issue117_physical_retention tests.test_issue117_arm_a_retention tests.test_issue117_arm_b_retention tests.test_issue117_arm_c_retention tests.test_issue117_arm_c_blocker tests.test_issue129_arm_c_retry tests.test_issue133_arm_c_retry_campaign tests.test_issue133_arm_c_retry_direct tests.test_issue133_corrected_freeze tests.test_issue133_gate_tooling_drift tests.test_issue133_prelaunch_bootstrap tests.test_issue133_physical_execution_retention -v

      - name: Check issue 137 Arm-C regime-4 diagnosis (CPU-only)
        run: python3 -m unittest tests.test_issue137_regime4_diagnosis -v

      - name: Check issue 99 plan-driven artifact acquisition (CPU-only)
        run: python3 -m unittest tests.test_issue99_artifact_core tests.test_issue99_proof -v

      - name: Check issue 101 plan-driven artifact orchestration (CPU-only)
        run: python3 -m unittest tests.test_issue101_orchestration tests.test_issue101_proof -v

      - name: Check issue 103 artifact-locality transition planning (CPU-only)
        run: python3 -m unittest tests.test_issue103_planner -v

      - name: Check internal Markdown links
        run: |
          python3 - <<'EOF'
          import os, re, sys

          root = "."
          md_files = []
          for dirpath, dirnames, filenames in os.walk(root):
              if dirpath.startswith(("./.git", "./.github/workflows")):
                  dirnames[:] = []
                  continue
              for name in filenames:
                  if name.endswith(".md"):
                      md_files.append(os.path.join(dirpath, name))

          link_re = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          errors = []
          checked = 0
          for path in md_files:
              base = os.path.dirname(path)
              text = open(path, encoding="utf-8").read()
              for target in link_re.findall(text):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  target = target.split("#")[0]
                  if not target:
                      continue
                  resolved = os.path.normpath(os.path.join(base, target))
                  checked += 1
                  if not os.path.exists(resolved):
                      errors.append(f"{path}: broken link -> {target}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"{checked} internal links across {len(md_files)} Markdown files OK")
          EOF

      - name: Check repository hygiene
        run: |
          # No empty directories should be committed content (git does not
          # track them anyway) — this catches stray local-only clutter.
          find . -path ./.git -prune -o -type d -empty -print | grep . && {
            echo "Empty directories found"; exit 1; } || echo "No empty directories"

      - name: Check consistent project naming
        run: |
          # "InferSwarm" is the project name in prose. Lowercase "inferswarm"
          # is legitimate only as a repo/branch/URL/identifier reference.
          # Misspelling forms are rejected outright (grep); the prose check
          # strips fenced code blocks first, since branch/repo names inside
          # code fences are legitimately lowercase.
          if grep -rnE 'Inferswarm|Infer Swarm|InferSWARM|InfersWARM' --include='*.md' .; then
            echo "Misspelled project name found"
            exit 1
          fi
          python3 - <<'EOF'
          import glob, re, sys
          fence = re.compile(r"^[ \t]*(```|~~~).*$")
          bad = []
          for path in glob.glob("**/*.md", recursive=True):
              if ".git/" in path:
                  continue
              keep = True   # True = prose, False = inside fence
              lines = []
              for line in open(path, encoding="utf-8"):
                  if fence.match(line):
                      keep = not keep
                      continue
                  if keep:
                      lines.append(line)
              prose = "".join(lines)
              # lowercase inferswarm in prose, excluding backticked refs
              for m in re.finditer(r"(?<![/`\w-])inferswarm(?![/\w-])", prose):
                  ctx = prose[max(0, m.start()-40):m.end()+40].replace("\n", " ")
                  bad.append(f"{path}: ...{ctx}...")
          if bad:
              print("\n".join(bad))
              print("Lowercase 'inferswarm' in prose — use 'InferSwarm'")
              sys.exit(1)
          print("Naming consistent")
          EOF
