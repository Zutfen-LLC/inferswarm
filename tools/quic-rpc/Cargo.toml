[package]
name = "inferswarm-quic-rpc"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
quinn = { version = "=0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.43", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "=2.2.0"
tokio = { version = "=1.53.1", features = ["rt", "time", "net", "io-util"] }
serde_json = "=1.0.151"
libc = "=0.2.189"
socket2 = "=0.6.5"

[build-dependencies]
cc = "=1.4.4"
sha2 = "=0.10.9"
