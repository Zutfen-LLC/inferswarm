name: Final CPU Validation

# Hosted canonical Final CPU Validation (Issue #226).
#
# The explicit post-review path for a merge-candidate PR head: it runs the
# canonical full CPU suite (scripts/run_full_cpu_suite.py — the same
# discovery/population-authority/serial-vs-executed identity contract as a
# local run), plus the deterministic finalizer and project-status fixed
# point checks, exactly once on ONE exact reviewed head.
#
# Trigger discipline: workflow_dispatch ONLY, with a required 40-hex
# expected_sha input. The dispatch ref is transport only; expected_sha is
# the execution authority (the workflow checks out that exact commit and
# mechanically requires git rev-parse HEAD == expected_sha before anything
# else runs). Invoked after maintainer GO per
# docs/campaign-gate-ordering.md, e.g.:
#   gh workflow run final-cpu-validation.yml \
#     --ref <pr-branch> -f expected_sha=<exact-reviewed-head-sha>
#
# Ordinary PR CI (.github/workflows/ci.yml) stays impact-selected and
# NEVER runs the full suite on ordinary pushes; the two gates are
# deliberately distinct checks. Both must succeed on the same exact head
# before merge. No pull_request_target; no untrusted PR code with
# elevated secrets (permissions are contents: read).

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact reviewed PR head (40-hex SHA) to validate"
        required: true
        type: string
      pr_number:
        description: "PR number for audit/navigation (optional; SHA is authority)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One final validation per requested SHA: a second dispatch for the same
  # exact head queues behind (or is inspected as a duplicate); the validated
  # subject can never silently drift because the checkout is SHA-bound.
  group: final-cpu-validation-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  final-cpu-validation:
    name: Final CPU Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Validate expected_sha shape (fail closed)
        run: |
          python3 - <<'EOF'
          import re, sys
          sha = "${{ inputs.expected_sha }}"
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              print(f"expected_sha is not an exact 40-hex git SHA: {sha!r}")
              sys.exit(1)
          print("expected_sha shape OK:", sha)
          EOF

      - name: Check out the exact expected SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Mechanically require HEAD == expected_sha
        run: |
          head="$(git rev-parse HEAD)"
          expected="${{ inputs.expected_sha }}"
          echo "HEAD=$head expected=$expected"
          if [ "$head" != "$expected" ]; then
            echo "checked-out head does not match the requested exact SHA (fail closed)"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        python-version: "3.12"

      - name: Bootstrap canonical CPU test environment (Issue #131)
        run: |
          python3 scripts/bootstrap_test_env.py
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Doctor CPU test environment (Issue #131)
        run: .venv/bin/python scripts/check_test_env.py

      - name: Run canonical full CPU suite (serial/executed identity required)
        run: |
          set -euo pipefail
          started=$(date +%s)
          set +e
          .venv/bin/python scripts/run_full_cpu_suite.py --json > /tmp/suite-result.json
          suite_rc=$?
          set -e
          ended=$(date +%s)
          echo "$started" > /tmp/suite-started.unix
          echo "$ended" > /tmp/suite-ended.unix
          echo "suite exit code: $suite_rc"
          # The suite FAIL fails the Final CPU Validation Gate here.
          exit $suite_rc

      - name: Run deterministic finalizer check (Issue #130)
        run: python3 scripts/finalize_repository.py --check

      - name: Run project-status check
        run: python3 scripts/sync_project_status.py --check

      - name: Compose and validate final-validation receipt (fail closed)
        run: |
          python3 - <<'EOF'
          import json, sys
          sys.path.insert(0, "scripts")
          import issue213_gate_orchestration as gate

          expected_sha = "${{ inputs.expected_sha }}"
          run_id = "${{ github.run_id }}"
          run_attempt = int("${{ github.run_attempt }}")
          workflow_name = "${{ github.workflow }}"
          pr_number_raw = "${{ inputs.pr_number }}".strip()
          pr_number = int(pr_number_raw) if pr_number_raw else None

          def die(message):
              print(f"final-validation receipt: FAIL {message}")
              sys.exit(1)

          try:
              result = json.load(open("/tmp/suite-result.json"))
          except (OSError, json.JSONDecodeError) as error:
              die(f"suite result unreadable: {error}")

          # The canonical suite identity — runner schema, canonical command,
          # normalized configuration, serial/executed digest EQUALITY, count
          # — is derived (never trusted from the workflow env): a malformed
          # or identity-mismatched result fails the validation here.
          try:
              suite = gate.suite_identity(result)
          except gate.GateOrderingError as error:
              die(f"suite identity malformed: {error}")
          if suite["serial_digest"] != suite["executed_digest"]:
              die("serial/executed identity mismatch")

          # Independently re-derive the expected identity from the exact
          # checked-out tree and require the executed run to match it: a
          # different suite configuration or environment cannot validate
          # this head.
          request = gate.current_final_head_request(".")
          if request.git_commit_sha != expected_sha:
              die("final-head request SHA drifted from expected_sha")
          if request.suite["serial_digest"] != suite["serial_digest"]:
              die("executed population digest differs from this head's "
                  "canonical plan")
          if request.suite["count"] != suite["count"]:
              die("executed count differs from this head's canonical plan")
          if request.suite["suite_config"] != suite["suite_config"]:
              die("executed suite configuration differs from the canonical "
                  "final-validation configuration")

          # The exact-head suite receipt (same #213 machinery as a local
          # run; no local/hosted double requirement).
          started = float(open("/tmp/suite-started.unix").read().strip())
          ended = float(open("/tmp/suite-ended.unix").read().strip())
          try:
              receipt = gate.build_receipt(".", result, started, ended)
          except gate.GateOrderingError as error:
              die(f"cannot bind suite receipt to the exact head: {error}")
          if not gate.validate_receipt(receipt.to_dict(),
                                       request.to_dict()):
              die("suite receipt does not validate against the exact head")

          # ONE envelope contract, built by the repository-owned builder:
          # finalizer_check/project_status_check are True precisely because
          # this step runs only after those steps succeeded on this head.
          try:
              envelope = gate.build_final_validation_receipt(
                  expected_sha, receipt.to_dict(),
                  github_run_id=run_id, github_run_attempt=run_attempt,
                  workflow=workflow_name, pr_number=pr_number,
                  finalizer_check=True, project_status_check=True)
          except gate.GateOrderingError as error:
              die(f"cannot build the final-validation receipt: {error}")
          json.dump(envelope, open("/tmp/final-validation-receipt.json", "w"),
                    indent=1, sort_keys=True)
          print("final-validation receipt: OK")
          print(json.dumps(envelope, sort_keys=True)[:2000])
          EOF

      - name: Retain final-validation receipt artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-cpu-validation-receipt
          path: |
            /tmp/final-validation-receipt.json
            /tmp/suite-result.json
          retention-days: 90
          if-no-files-found: error

      - name: Final CPU Validation summary
        run: |
          echo "Final CPU Validation PASS on exact head ${{ inputs.expected_sha }}"
          echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
