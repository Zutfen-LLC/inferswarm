name: CI

# Impact-selected CI (Issue #148).
#
# PR path:   plan -> repo-integrity (always-on) + selected impact
#            groups -> CI Gate
# main path: full regression (all groups, sharded) -> CI Gate
# unknown/shared/authority change: planner fails closed to full
#
# Selection authority is repository-owned (scripts/plan_ci.py +
# scripts/ci_groups.json); no third-party action decides which
# correctness suites run. See docs/ci-impact-planning.md.
#
# Deliberately NOT here: GPU benchmarks (no fake GPU CI), no
# self-hosted runners attached to public-PR-triggered workflows.
# Hardware benchmarks run on trusted hardware and are committed with
# provenance; see BENCHMARKING.md and SECURITY.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_regression:
        description: "Force full regression (all groups)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  # Deterministic pip behavior across runners.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  plan:
    name: Plan CI (impact selection)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      full_regression: ${{ steps.plan.outputs.full_regression }}
      groups: ${{ steps.plan.outputs.groups }}
      selected: ${{ steps.parse.outputs.selected }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compute changed paths (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only --diff-filter=ACDMRT "origin/${GITHUB_BASE_REF}...HEAD" > /tmp/changed_paths.txt || true
          # The three-dot form against the fetched base ref is the
          # PR/base range; if it yields nothing the planner fails
          # closed on the empty set — it never narrows silently.
          echo "--- changed paths ---"
          cat /tmp/changed_paths.txt

      - name: Compute changed paths (push)
        if: github.event_name == 'push'
        run: |
          # Push to main: full regression contract; paths recorded for
          # the plan explanation only.
          git diff --name-only --diff-filter=ACDMRT "${{ github.event.before }}..${{ github.sha }}" > /tmp/changed_paths.txt || true
          cat /tmp/changed_paths.txt || true

      - name: Plan (push to main / manual -> full)
        if: github.event_name != 'pull_request'
        run: |
          python3 scripts/plan_ci.py --mode full --output /tmp/plan.json
          cat /tmp/plan.json

      - name: Plan (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/plan_ci.py --mode pr --output /tmp/plan.json < /tmp/changed_paths.txt
          cat /tmp/plan.json

      - name: Validate plan shape (fail closed on malformed output)
        run: |
          python3 - <<'EOF'
          import json, sys
          p = json.load(open("/tmp/plan.json"))
          assert p["schema"] == "ci-plan/1", p
          assert p["mode"] in ("targeted", "full"), p
          assert isinstance(p["full_regression"], bool), p
          assert isinstance(p["groups"], list) and p["groups"], p
          assert all(isinstance(g, str) for g in p["groups"]), p
          print("plan schema OK:", p["mode"], p["groups"])
          EOF

      - name: Expose plan outputs
        id: plan
        run: |
          mode=$(python3 -c "import json;print(json.load(open('/tmp/plan.json'))['mode'])")
          full=$(python3 -c "import json;print(json.dumps(json.load(open('/tmp/plan.json'))['full_regression']))")
          groups=$(python3 -c "import json;print(json.dumps(json.load(open('/tmp/plan.json'))['groups']))")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "full_regression=$full" >> "$GITHUB_OUTPUT"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

      - name: Parse selection flags
        id: parse
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open("/tmp/plan.json"))
          for g in ["repo-integrity", "issue-74-79", "issue-83-95",
                    "issue-109-110", "issue-117-133", "issue-137",
                    "issue-99-103", "vulkan-v0-b", "phase1-analysis",
                    "issue-115-cleanup"]:
              key = g.replace("-", "_")
              print(f"{key}={'true' if g in p['groups'] else 'false'}")
          EOF

      - name: Upload plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-plan
          path: /tmp/plan.json
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Always-on repository integrity (every event, every mode).
  # ---------------------------------------------------------------------------
  repo-integrity:
    name: Group repo-integrity (always-on)
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Bootstrap canonical CPU test environment (Issue #131)
        run: |
          python3 scripts/bootstrap_test_env.py
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Doctor CPU test environment (Issue #131)
        run: .venv/bin/python scripts/check_test_env.py

      - name: Validate YAML files
        run: |
          python3 - <<'EOF'
          import sys, glob
          import yaml
          files = glob.glob(".github/**/*.yml", recursive=True) + \
                  glob.glob(".github/**/*.yaml", recursive=True)
          if not files:
              sys.exit("No YAML files found — checker misconfigured")
          for f in files:
              with open(f) as fh:
                  list(yaml.safe_load_all(fh))
              print(f"OK  {f}")
          print(f"{len(files)} YAML files valid")
          EOF

      - name: Check generated project status
        run: |
          python3 scripts/sync_project_status.py --check
          python3 -m unittest tests.test_project_status -v

      - name: Check deterministic repository finalization (Issue #130)
        run: |
          python3 scripts/finalize_repository.py --check
          python3 -m unittest tests.test_finalize_repository -v

      - name: Check evidence manifest lifecycle
        run: |
          python3 scripts/issue137_manifest.py --check
          python3 -m unittest tests.test_evidence_manifest_lifecycle -v

      - name: Check frozen Phase-0 workloads
        run: python3 scripts/check_phase0_workloads.py

      - name: Check issue 131 canonical CPU test environment (CPU-only)
        run: python3 -m unittest tests.test_issue131_cpu_test_env -v

      - name: Check CI planner self-check (Issue #148)
        run: python3 scripts/plan_ci.py --self-check

      - name: Check internal Markdown links
        run: |
          python3 - <<'EOF'
          import os, re, sys

          root = "."
          md_files = []
          for dirpath, dirnames, filenames in os.walk(root):
              if dirpath.startswith(("./.git", "./.github/workflows")):
                  dirnames[:] = []
                  continue
              for name in filenames:
                  if name.endswith(".md"):
                      md_files.append(os.path.join(dirpath, name))

          link_re = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          errors = []
          checked = 0
          for path in md_files:
              base = os.path.dirname(path)
              text = open(path, encoding="utf-8").read()
              for target in link_re.findall(text):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  target = target.split("#")[0]
                  if not target:
                      continue
                  resolved = os.path.normpath(os.path.join(base, target))
                  checked += 1
                  if not os.path.exists(resolved):
                      errors.append(f"{path}: broken link -> {target}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"{checked} internal links across {len(md_files)} Markdown files OK")
          EOF

      - name: Check repository hygiene
        run: |
          # No empty directories should be committed content (git does not
          # track them anyway) — this catches stray local-only clutter.
          # The bootstrapped CPU test environment (.venv/, Issue #131) is
          # legitimate gitignored local state, not clutter.
          find . \( -path ./.git -o -path ./.venv \) -prune -o -type d -empty -print | grep . && {
            echo "Empty directories found"; exit 1; } || echo "No empty directories"

      - name: Check consistent project naming
        run: |
          # "InferSwarm" is the project name in prose. Lowercase "inferswarm"
          # is legitimate only as a repo/branch/URL/identifier reference.
          # Misspelling forms are rejected outright (grep); the prose check
          # strips fenced code blocks first, since branch/repo names inside
          # code fences are legitimately lowercase.
          if grep -rnE 'Inferswarm|Infer Swarm|InferSWARM|InfersWARM' --include='*.md' .; then
            echo "Misspelled project name found"
            exit 1
          fi
          python3 - <<'EOF'
          import glob, re, sys
          fence = re.compile(r"^[ \t]*(```|~~~).*$")
          bad = []
          for path in glob.glob("**/*.md", recursive=True):
              if ".git/" in path:
                  continue
              keep = True   # True = prose, False = inside fence
              lines = []
              for line in open(path, encoding="utf-8"):
                  if fence.match(line):
                      keep = not keep
                      continue
                  if keep:
                      lines.append(line)
              prose = "".join(lines)
              # lowercase inferswarm in prose, excluding backticked refs
              for m in re.finditer(r"(?<![/`\w-])inferswarm(?![/\w-])", prose):
                  ctx = prose[max(0, m.start()-40):m.end()+40].replace("\n", " ")
                  bad.append(f"{path}: ...{ctx}...")
          if bad:
              print("\n".join(bad))
              print("Lowercase 'inferswarm' in prose — use 'InferSwarm'")
              sys.exit(1)
          print("Naming consistent")
          EOF

  # ---------------------------------------------------------------------------
  # Impact-selected groups. Each job is conditional on the planner's
  # selection; a skip is legitimate (the CI Gate verifies selection
  # consistency, not mere job existence).
  # ---------------------------------------------------------------------------

