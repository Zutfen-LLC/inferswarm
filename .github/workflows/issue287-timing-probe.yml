name: issue287-timing-probe

# THROWAWAY Phase-0 measurement for Issue #287 (never merged).
# Runs the UNMODIFIED r8i-qwen-qualification test modules under a
# per-test timing harness on a hosted runner. No production behavior is
# changed; output is a small timing JSON (no secrets, no evidence bytes).

on:
  push:
    branches: [issue-287-timing-probe]

permissions:
  contents: read

jobs:
  probe:
    name: probe shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            modules: "tests.test_issue278_integration"
          - shard: 2
            modules: "tests.test_issue273_evidence"
          - shard: 3
            modules: "tests.test_issue244_r8i5_v340l_import tests.test_issue248_diagnostic tests.test_issue250_physical tests.test_issue250_amendment008 tests.test_issue250_amendment008_reducer_admission_negative tests.test_issue250_pass6_corrections tests.test_issue252_arms tests.test_issue252_capture tests.test_issue252_mechanism tests.test_issue262_source_patch tests.test_issue275_provenance tests.test_issue280_real_compat"
          - shard: 4
            modules: "tests.test_issue237_r8i_methodology tests.test_issue250_v0n_nvidia tests.test_issue250_amendment008_reducer_admission tests.test_issue252_physical tests.test_issue252_terminal tests.test_issue252_round5 tests.test_issue254_round5 tests.test_issue258_theorem tests.test_issue260_observation tests.test_issue262_h5 tests.test_issue264_source_patch tests.test_issue264_pilot tests.test_issue275_collector tests.test_issue280_runner tests.test_issue280_task_check tests.test_issue280_retention_fix tests.test_issue280_source_compat"
          - shard: 5
            modules: "tests.test_issue250_terminal tests.test_issue250_amendment008_round2 tests.test_issue252_phase0 tests.test_issue252_round4 tests.test_issue254_producer tests.test_issue254_round7 tests.test_issue264_h5 tests.test_issue273_admission tests.test_issue276_byte_admission tests.test_issue280_source tests.test_issue280_admission"
          - shard: 6
            modules: "tests.test_issue250_diagnostic tests.test_issue250_terminalization tests.test_issue252_vulkanpath tests.test_issue260_source_patch tests.test_issue262_pilot tests.test_issue270_authority tests.test_issue273_round3_trust_boundaries tests.test_issue275_demo tests.test_issue277_reference_first tests.test_issue280_observer"
    steps:
      - name: Runner identity
        run: |
          mkdir -p /tmp/probe-out
          {
            echo "nproc=$(nproc)"
            grep -m1 'model name' /proc/cpuinfo
            grep -E 'MemTotal' /proc/meminfo
            echo "ImageOS=$ImageOS ImageVersion=$ImageVersion RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH"
            df -h "$GITHUB_WORKSPACE" | tail -1
          } | tee /tmp/probe-out/runner-shard${{ matrix.shard }}.txt
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Bootstrap canonical CPU test environment (Issue #131)
        run: |
          python3 scripts/bootstrap_test_env.py
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Doctor CPU test environment (Issue #131)
        run: .venv/bin/python scripts/check_test_env.py
      - name: Timed run
        run: python3 .github/probe/timeit.py /tmp/probe-out/timing-shard${{ matrix.shard }}.json ${{ matrix.modules }}
      - name: Upload timing
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timing-shard${{ matrix.shard }}
          path: /tmp/probe-out
          retention-days: 14
