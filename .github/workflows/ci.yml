  # ---------------------------------------------------------------------------
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [plan, repo-integrity, issue-74-79, issue-83-95, issue-109-110,
            issue-117-133, issue-187-r7a, issue-209-r7b, issue-222-r7c,
            issue-99-103, issue-213-gate-ordering, r8i-qwen-qualification,
            r8-qwen-lineage, issue-115-cleanup]
    if: always()
    steps:
      - name: Aggregate selected results (fail closed)
        run: |
          python3 - <<'EOF'
          import json, os, sys

          results = {
              "repo-integrity": "${{ needs.repo-integrity.result }}",
              "issue-74-79": "${{ needs.issue-74-79.result }}",
              "issue-83-95": "${{ needs.issue-83-95.result }}",
              "issue-109-110": "${{ needs.issue-109-110.result }}",
              "issue-117-133": "${{ needs.issue-117-133.result }}",
              "issue-213-gate-ordering": "${{ needs.issue-213-gate-ordering.result }}",
              "issue-187-r7a": "${{ needs.issue-187-r7a.result }}",
              "issue-209-r7b": "${{ needs.issue-209-r7b.result }}",
              "issue-222-r7c": "${{ needs.issue-222-r7c.result }}",
              "issue-99-103": "${{ needs.issue-99-103.result }}",
              "r8i-qwen-qualification": "${{ needs.r8i-qwen-qualification.result }}",
              "r8-qwen-lineage": "${{ needs.r8-qwen-lineage.result }}",
              "issue-115-cleanup": "${{ needs.issue-115-cleanup.result }}",
          }
          # The plan is re-derived from planner outputs embedded below;
          # malformed or missing plan output fails closed.
          plan_mode = "${{ needs.plan.outputs.mode }}"
          plan_full = "${{ needs.plan.outputs.full_regression }}"
          plan_groups = json.loads(r'''${{ needs.plan.outputs.groups }}''')
          planner_result = "${{ needs.plan.result }}"

          print("planner:", planner_result, "mode:", plan_mode,
                "full_regression:", plan_full)
          print("groups:", plan_groups)
          print("results:", json.dumps(results, indent=1))

          failures = []
          if planner_result != "success":
              failures.append(f"planner job result: {planner_result}")
          if plan_mode not in ("targeted", "full"):
              failures.append(f"plan mode malformed: {plan_mode!r}")
          if plan_full not in ("true", "false"):
              failures.append(f"plan full_regression malformed: {plan_full!r}")
          if not isinstance(plan_groups, list) or not plan_groups:
              failures.append("plan groups malformed or empty")

          selected = set(plan_groups) if isinstance(plan_groups, list) else set()
          full = plan_full == "true"

          # Every selected group must map to a job result of success.
          job_for_group = {
              "repo-integrity": "repo-integrity",
              "issue-74-79": "issue-74-79",
              "issue-83-95": "issue-83-95",
              "issue-109-110": "issue-109-110",
              "issue-117-133": "issue-117-133",
              "issue-213-gate-ordering": "issue-213-gate-ordering",
              "issue-187-r7a": "issue-187-r7a",
              "issue-209-r7b": "issue-209-r7b",
              "issue-222-r7c": "issue-222-r7c",
              "issue-99-103": "issue-99-103",
              "r8i-qwen-qualification": "r8i-qwen-qualification",
              "r8-qwen-lineage": "r8-qwen-lineage",
              "issue-115-cleanup": "issue-115-cleanup",
          }
          for group in sorted(selected):
              job = job_for_group.get(group)
              if job is None:
                  failures.append(f"selected group {group} has no job mapping")
                  continue
              r = results[job]
              if r != "success":
                  failures.append(
                      f"selected group {group} ({job}) result: {r}")

          # Unselected groups must not have failed: a failure in a
          # skipped-by-planner job is still a real failure signal.
          for group, job in job_for_group.items():
              if group not in selected and results[job] in ("failure", "cancelled"):
                  failures.append(
                      f"unselected group {group} ({job}) still failed: {results[job]}")

          if failures:
              print("CI GATE FAILED:")
              for f in failures:
                  print(" -", f)
              sys.exit(1)
          print("CI Gate: PASS — planner OK, repo-integrity OK, "
                "all selected groups succeeded")
          EOF
